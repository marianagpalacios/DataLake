[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datalake-health-platform"
version = "0.7.0"
description = "Plataforma educacional de engenharia de dados em saúde."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi[standard]>=0.116,<1.0",
    "pandas>=3.0,<4.0",
    "psycopg[binary]>=3.3,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
     "httpx>=0.28,<1.0",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "unit: testes isolados sem dependências externas",
    "integration: testes que utilizam PostgreSQL",
    "api: testes do contrato HTTP da FastAPI",
    "migration: testes de upgrade e downgrade do Alembic",
]

[tool.coverage.run]
branch = true
source = ["datalake"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    'if __name__ == .__main__.:',
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

