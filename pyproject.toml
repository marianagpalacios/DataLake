[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "datalake-health-platform"
version = "1.0.1"
description = "Plataforma educacional de engenharia de dados em saúde."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "alembic>=1.16,<2.0",
    "fastapi[standard]>=0.116,<1.0",
    "pandas>=3.0,<4.0",
    "psycopg[binary]>=3.3,<4.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2.0",
    "httpx>=0.28,<1.0",
    "pytest>=9,<10",
    "pytest-cov>=7,<8",
    "ruff>=0.16,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "unit: testes isolados sem dependências externas",
    "integration: testes que utilizam PostgreSQL",
    "api: testes do contrato HTTP da FastAPI",
    "migration: testes de upgrade e downgrade do Alembic",
]

[tool.coverage.run]
branch = true
source = ["datalake"]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
fail_under = 80
exclude_also = [
    "if TYPE_CHECKING:",
    'if __name__ == .__main__.:',
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [
    "alembic/versions",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "B",
]

[tool.ruff.lint.isort]
known-first-party = [
    "datalake",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
