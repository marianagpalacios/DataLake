name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

  POSTGRES_DB: datalake
  POSTGRES_USER: datalake_user
  POSTGRES_PASSWORD: ci_local_password
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"

jobs:
  quality:
    name: Quality

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: python -m ruff format --check src tests

      - name: Run lint
        run: python -m ruff check src tests

      - name: Compile source code
        run: python -m compileall src tests

      - name: Build Python package
        run: python -m build

      - name: Validate package metadata
        run: |
          python - <<'PY'
          from importlib.metadata import version
          from datalake.api import app

          package_version = version(
              "datalake-health-platform"
          )

          assert app.version == package_version

          print(
              "Package and API version:",
              package_version,
          )
          PY

      - name: Upload Python package
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  tests:
    name: Tests and coverage

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine

        env:
          POSTGRES_DB: datalake_test
          POSTGRES_USER: datalake_test_user
          POSTGRES_PASSWORD: ci_test_password

        ports:
          - 5432:5432

        options: >-
          --health-cmd
          "pg_isready -U datalake_test_user -d datalake_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_POSTGRES_DB: datalake_test
      TEST_POSTGRES_USER: datalake_test_user
      TEST_POSTGRES_PASSWORD: ci_test_password
      TEST_POSTGRES_HOST: localhost
      TEST_POSTGRES_PORT: "5432"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests and coverage
        run: |
          mkdir -p test-results

          python -m pytest \
            --cov=datalake \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=html \
            --cov-report=xml \
            --junitxml=test-results/junit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-coverage-reports
          path: |
            test-results/junit.xml
            coverage.xml
            htmlcov/
          if-no-files-found: warn
          retention-days: 14

  docker-build:
    name: Docker build

    runs-on: ubuntu-latest

    needs:
      - quality
      - tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Create temporary Docker environment
        run: |
          cat > .env <<'EOF'
          POSTGRES_DB=datalake
          POSTGRES_USER=datalake_user
          POSTGRES_PASSWORD=ci_docker_password
          POSTGRES_HOST=postgres
          POSTGRES_PORT=5432
          EOF

      - name: Validate Docker Compose
        run: docker compose config > /dev/null

      - name: Build API image
        run: |
          docker build \
            --tag datalake:${{ github.sha }} \
            .

      - name: Validate package inside image
        run: |
          docker run --rm \
            datalake:${{ github.sha }} \
            python -c \
            "from importlib.metadata import version; print(version('datalake-health-platform'))"

      - name: Remove temporary environment
        if: always()
        run: rm -f .envname: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

