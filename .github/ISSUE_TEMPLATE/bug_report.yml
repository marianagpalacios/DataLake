name: Relatar um bug

description: Informe um comportamento incorreto ou inesperado.

title: "[BUG] "

labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Obrigada por contribuir com o DataLake.

        Não inclua credenciais nem dados reais de saúde.

  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Explique o comportamento observado.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
      description: Liste os comandos e ações necessários.
      placeholder: |
        1. Execute...
        2. Acesse...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidências
      description: |
        Inclua mensagens ou capturas sem dados sensíveis.

  - type: input
    id: version
    attributes:
      label: Versão
      placeholder: v0.8.0

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidade
      options:
        - label: Confirmei que não há credenciais ou dados reais de saúde.
          required: true